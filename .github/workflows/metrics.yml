name: Metrics
on:
  # 每天 08:30 (北京时间) 自动刷新一次
  schedule: [{ cron: "30 0 * * *" }]
  # 允许在 Actions 页手动触发 / 我用 gh 触发
  workflow_dispatch:
jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Languages (含私有仓库, 仅统计语言占比)
        uses: lowlighter/metrics@latest
        with:
          # 读取私有仓库语言用的个人令牌 (你在仓库 Secrets 里加 METRICS_TOKEN)
          token: ${{ secrets.METRICS_TOKEN }}
          user: branchkim
          filename: metrics-languages.svg
          # 只渲染语言插件, 不带头像/仓库数等默认信息, 保持干净
          base: ""
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: dockerfile, makefile, tex, procfile
